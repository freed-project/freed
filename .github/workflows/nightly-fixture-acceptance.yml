name: Nightly fixture supervision

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/nightly-fixture-acceptance.yml
      - scripts/nightly-fixture-acceptance.mjs
      - scripts/nightly-self-improve.test.mjs
      - scripts/run-tooling-smoke-shard.mjs
      - scripts/run-tooling-smoke-shard.test.mjs
      - scripts/measure-tooling-smoke.mjs
      - scripts/test-helpers/nightly-fixture-*
      - scripts/test-helpers/nightly_fixture_darwin.py
      - .nvmrc
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: nightly-fixture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-fixtures:
    name: Nightly fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prove deadlines, process generations and descendant cleanup
        run: node --test scripts/run-tooling-smoke-shard.test.mjs
      - name: Prove healthy nightly shard and measurement execution
        run: node scripts/nightly-fixture-acceptance.mjs
