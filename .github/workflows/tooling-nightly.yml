name: Issue 1627 native Library experiment

# Temporary branch-only replacement of registered workflow 320360119.
# NEVER MERGE. Candidate retains its original workflow. No PR 2114 changes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-1627-native-experiment
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native-proof:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chore/issue-1627-native-experiment'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Initialize failure evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir receipts
          sw_vers > receipts/host.log
          uname -a >> receipts/host.log
          printf 'experiment=%s\nsource=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" '69f8446a5050a6881cb08a0064c7bfb59a6cacf4' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> receipts/host.log

      - name: Checkout reviewed experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          path: experiment
          persist-credentials: false

      - name: Checkout frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: 69f8446a5050a6881cb08a0064c7bfb59a6cacf4
          path: candidate
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1

      - name: Pin npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.11.0 --ignore-scripts --no-audit --no-fund 2>&1 | tee receipts/npm-pin.log
          test "$(node --version)" = v24.14.1
          test "$(npm --version)" = 11.11.0

      - name: Prebuild and prove frozen native candidate
        shell: bash
        run: |
          set -euo pipefail
          umask 0022
          node experiment/.github/experiments/issue-1627-native.mjs candidate receipts/proof 2>&1 | tee receipts/driver.log

      - name: Retain identities coverage and logs on failure too
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-1627-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts
          retention-days: 14
          if-no-files-found: error
