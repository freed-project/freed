# NEVER MERGE. Branch-only status experiment for #2121.
# Synthetic dependencies and event context; not production/native execution.
name: "Never merge: native gate cancellation proof"
"on":
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: native-gate-cancel-proof-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  tooling-smoke-plan:
    name: Synthetic tooling-smoke-plan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chore/native-gate-cancel-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Supply synthetic accepted result
        id: fixture
        run: |
          echo 'SYNTHETIC ONLY: tooling-smoke-plan; no product or native proof'
          echo 'applicable=true' >> "$GITHUB_OUTPUT"
          echo 'native=true' >> "$GITHUB_OUTPUT"
          echo 'preview-native=true' >> "$GITHUB_OUTPUT"
          echo 'job-count=1' >> "$GITHUB_OUTPUT"
    outputs:
      applicable: ${{ steps.fixture.outputs.applicable }}
      native: ${{ steps.fixture.outputs.native }}
      preview-native: ${{ steps.fixture.outputs.preview-native }}
      job-count: ${{ steps.fixture.outputs.job-count }}
  tooling-smoke-shards:
    name: Synthetic tooling-smoke-shards
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chore/native-gate-cancel-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Supply synthetic accepted result
        id: fixture
        run: |
          echo 'SYNTHETIC ONLY: tooling-smoke-shards; no product or native proof'
  native-acceptance:
    name: Synthetic native-acceptance
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chore/native-gate-cancel-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Supply synthetic accepted result
        id: fixture
        run: |
          echo 'SYNTHETIC ONLY: native-acceptance; no product or native proof'
  preview-process-acceptance:
    name: Synthetic preview-process-acceptance
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chore/native-gate-cancel-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Supply synthetic accepted result
        id: fixture
        run: |
          echo 'SYNTHETIC ONLY: preview-process-acceptance; no product or native proof'
  feature:
    name: Synthetic feature
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chore/native-gate-cancel-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Supply synthetic accepted result
        id: fixture
        run: |
          echo 'SYNTHETIC ONLY: feature; no product or native proof'
          echo "needs-webkit=true" >> "$GITHUB_OUTPUT"
    outputs:
      needs-webkit: ${{ steps.fixture.outputs.needs-webkit }}
  pwa-opfs-acceptance:
    name: Synthetic pwa-opfs-acceptance
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chore/native-gate-cancel-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Supply synthetic accepted result
        id: fixture
        run: |
          echo 'SYNTHETIC ONLY: pwa-opfs-acceptance; no product or native proof'
  tooling-smoke:
    name: Never-merge cancellation probe aggregate
    if: ${{ always() }}
    needs:
      - tooling-smoke-plan
      - tooling-smoke-shards
      - native-acceptance
      - preview-process-acceptance
      - feature
      - pwa-opfs-acceptance
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout probe commit only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify included reviewed source
        id: source
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/chore/native-gate-cancel-proof
          printf '%s\n' '53a75ca66a5bc5e8c1c37444abbc995dd00cd96f1cc85b8a0146dc075821a6cb  scripts/experiments/native-gate-cancel-proof/source-ci.yml' | sha256sum --check
          echo 'PROBE_SOURCE_COMMIT=6364f7c7cc60413ffabb2388fcbf6375a8eefd9e'
          echo "PROBE_COMMIT=$GITHUB_SHA RUN=$GITHUB_RUN_ID ATTEMPT=$GITHUB_RUN_ATTEMPT"
          sha256sum .github/workflows/tooling-nightly.yml
      - name: Require the planned tooling smoke result
        if: ${{ always() }}
        env:
          EVENT_NAME: pull_request
          BASE_REF: dev
          REF: refs/pull/2121/merge
          FEATURE_RESULT: ${{ needs.feature.result }}
          OPFS_REQUIRED: ${{ needs.feature.outputs.needs-webkit }}
          OPFS_RESULT: ${{ needs.pwa-opfs-acceptance.result }}
          PLAN_RESULT: ${{ needs.tooling-smoke-plan.result }}
          SHARD_RESULT: ${{ needs.tooling-smoke-shards.result }}
          NATIVE_RESULT: ${{ needs.native-acceptance.result }}
          APPLICABLE: ${{ needs.tooling-smoke-plan.outputs.applicable }}
          NATIVE_REQUIRED: ${{ needs.tooling-smoke-plan.outputs.native }}
          PREVIEW_REQUIRED: ${{ needs.tooling-smoke-plan.outputs.preview-native }}
          PREVIEW_RESULT: ${{ needs.preview-process-acceptance.result }}
          JOB_COUNT: ${{ needs.tooling-smoke-plan.outputs.job-count }}
        run: |
          # Feature planning only runs for dev PRs. Never interpret a missing
          # selection as permission to omit the mandatory native proof.
          case "$EVENT_NAME/$BASE_REF/$REF" in
            pull_request/dev/*)
              if [ "$FEATURE_RESULT" != "success" ]; then
                echo "Feature validation did not succeed: $FEATURE_RESULT"
                exit 1
              fi
              case "$OPFS_REQUIRED/$OPFS_RESULT" in
                true/success|false/skipped) ;;
                *) echo "Invalid OPFS plan/result: $OPFS_REQUIRED/$OPFS_RESULT"; exit 1 ;;
              esac
              ;;
            push//refs/heads/dev)
              if [ "$FEATURE_RESULT" != "skipped" ] || [ "$OPFS_RESULT" != "success" ]; then
                echo "Dev push requires OPFS success and skipped PR feature validation."
                exit 1
              fi
              ;;
            pull_request/main/*)
              if [ "$FEATURE_RESULT" != "skipped" ] || [ "$OPFS_RESULT" != "skipped" ]; then
                echo "Main PR deliberately skips feature and OPFS validation."
                exit 1
              fi
              ;;
            *) echo "Unexpected validation event: $EVENT_NAME/$BASE_REF/$REF"; exit 1 ;;
          esac

          if [ "$PLAN_RESULT" != "success" ]; then
            echo "Tooling smoke planner did not succeed: $PLAN_RESULT"
            exit 1
          fi

          if [ "$APPLICABLE" = "true" ]; then
            if [ "$SHARD_RESULT" != "success" ]; then
              echo "Planner scheduled $JOB_COUNT shard(s); result was $SHARD_RESULT"
              exit 1
            fi
            echo "All $JOB_COUNT planned tooling smoke shard(s) passed."
          else
            if [ "$SHARD_RESULT" != "skipped" ]; then
              echo "Plan was not applicable but shards reported $SHARD_RESULT"
              exit 1
            fi
            echo "No changed path reaches the tooling smoke lane."
          fi

          # Cleanup can terminate processes and remove a worktree. Its native
          # proof is mandatory whenever selected, including skipped/cancelled jobs.
          if [ "$PREVIEW_REQUIRED" = "true" ]; then
            if [ "$PREVIEW_RESULT" != "success" ]; then
              echo "Preview process acceptance did not pass: $PREVIEW_RESULT"
              exit 1
            fi
          elif [ "$PREVIEW_REQUIRED" != "false" ] || [ "$PREVIEW_RESULT" != "skipped" ]; then
            echo "Invalid preview acceptance plan/result: $PREVIEW_REQUIRED/$PREVIEW_RESULT"
            exit 1
          fi

          # Observe-only for now, deliberately.
          #
          # These three files gate every test behind a module-level darwin
          # check, so on Ubuntu they have always skipped and asserted nothing.
          # This lane is the first time they execute at all, and the first run
          # hung for the full job timeout. Blocking on a known-hanging test
          # would stop every provider-visible change while proving nothing, and
          # non-blocking is still strictly more coverage than the zero we had.
          #
          # This becomes blocking once the hang is diagnosed. Tracked as debt.
          if [ "$NATIVE_REQUIRED" = "true" ]; then
            if [ "$NATIVE_RESULT" = "success" ]; then
              echo "Native acceptance passed on macOS."
            else
              echo "::warning::Native acceptance reported $NATIVE_RESULT (observe-only, not gating yet)"
            fi
          elif [ "$NATIVE_RESULT" != "skipped" ]; then
            echo "Native acceptance was not required but reported $NATIVE_RESULT"
            exit 1
          fi
        id: status
      - name: Bounded cancellation rendezvous
        id: rendezvous
        if: ${{ always() }}
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          STATUS_OUTCOME: ${{ steps.status.outcome }}
        run: |
          test "$SOURCE_OUTCOME" = success
          test "$STATUS_OUTCOME" = success
          # Experiment-only step after the unchanged reviewed status step.
          echo "PROBE_RENDEZVOUS_OPEN status_body=success wait_seconds=60"
          printf "PROBE_RENDEZVOUS_OPEN run=%s attempt=%s sha=%s utc=%s wait_seconds=60\n" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
          sleep 60
          echo "PROBE_RENDEZVOUS_CLOSED"
      - name: Reject workflow cancellation
        if: ${{ cancelled() }}
        timeout-minutes: 1
        run: |
          echo "Workflow cancellation prevents an acceptance verdict."
          exit 1
        id: guard
      - name: Classify probe evidence
        if: ${{ always() }}
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          STATUS_OUTCOME: ${{ steps.status.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          RENDEZVOUS_OUTCOME: ${{ steps.rendezvous.outcome }}
        run: |
          printf "PROBE_OUTCOMES status=%s rendezvous=%s guard=%s\n" "$STATUS_OUTCOME" "$RENDEZVOUS_OUTCOME" "$GUARD_OUTCOME"
          if [ "$SOURCE_OUTCOME" = success ] && [ "$STATUS_OUTCOME" = success ] && [ "$RENDEZVOUS_OUTCOME" = success ] && [ "$GUARD_OUTCOME" = failure ]; then
            echo "PROBE_GUARD_EXECUTED_AND_FAILED: correlate normal cancellation receipt and guard log"
          else
            echo "PROBE_NOT_PROVEN: missed cancellation, skipped guard, interruption or timeout"
            exit 1
          fi
