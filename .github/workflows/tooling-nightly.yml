name: Nightly exhaustive

# The blocking lanes are deliberately narrow. This is where the expensive work
# lives: every suite sharded into bounded repeated runs, plus the native
# acceptance tests on a real macOS runner.
#
# Nothing here gates a pull request. When it finds something it files debt the
# same way the dev lane files incidents, so a slow suite or a flaky test becomes
# a tracked issue instead of a surprise in someone's PR.

on:
  schedule:
    # 07:00 UTC, comfortably after the usual working day in the owner's timezone.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      repeat:
        description: "Runs per suite for flake discovery, from 1 through 3"
        required: false
        default: "2"

concurrency:
  group: tooling-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pwa-library-corpus-hardening:
    name: PWA Library corpus hardening (${{ matrix.browser }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            runner: ubuntu-latest
            target: "100000"
          - browser: webkit
            runner: macos-latest
            target: "25000"
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install browser system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps "${{ matrix.browser }}"
        working-directory: packages/pwa

      - name: Install browser
        run: npx playwright install "${{ matrix.browser }}"
        working-directory: packages/pwa

      - name: Exercise the OPFS Library corpus
        run: npm run test:e2e:corpus
        working-directory: packages/pwa
        env:
          FREED_PWA_CORPUS_BROWSER: ${{ matrix.browser }}
          FREED_PWA_CORPUS_TARGET: ${{ matrix.target }}

      - name: Upload PWA corpus measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-library-corpus-hardening-${{ matrix.browser }}
          path: packages/pwa/test-results/pwa-library-corpus-hardening.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload PWA corpus progress and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-library-corpus-progress-${{ matrix.browser }}
          path: |
            packages/pwa/test-results/pwa-library-corpus-hardening-progress.json
            packages/pwa/test-results/pwa-library-corpus-playwright
          retention-days: 30
          if-no-files-found: warn

      - name: Record a corpus hardening failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="(AI Generated).

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Commit: ${GITHUB_SHA}
          Browser: ${{ matrix.browser }}
          Target: ${{ matrix.target }}

          The nonblocking PWA OPFS corpus hardening lane failed before it could
          prove its configured corpus checkpoints. The uploaded progress receipt
          identifies the last completed batch and operation stage. The Playwright
          failure artifact contains the retained trace and screenshot."
          gh issue comment 1446 --body "$body"

  exhaustive-tooling-plan:
    name: Exhaustive tooling plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Plan bounded measurement shards
        id: plan
        # Two attempts run inside each job. Forty shards leave the slowest
        # projected job below 50 minutes even with the observed 1.5x imbalance,
        # while preserving the exact total test work.
        run: node scripts/plan-tooling-smoke.mjs --all --max-jobs 40 --github-output

  exhaustive-tooling-shards:
    name: Exhaustive tooling shard (${{ matrix.name }})
    needs: exhaustive-tooling-plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.exhaustive-tooling-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Measure the shard and look for flake
        run: |
          node scripts/measure-tooling-smoke.mjs \
            --suite=${{ matrix.suite }} \
            --shard-index=${{ matrix.shard }} \
            --shard-count=${{ matrix.shardCount }} \
            --repeat="${{ github.event.inputs.repeat || '2' }}" \
            --output-dir=tooling-smoke-measurements

      - name: Upload shard measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tooling-smoke-measurement-${{ matrix.suite }}-${{ matrix.shard }}-of-${{ matrix.shardCount }}
          path: tooling-smoke-measurements
          retention-days: 30
          if-no-files-found: error

  exhaustive-tooling:
    name: Exhaustive tooling suites
    needs: [exhaustive-tooling-plan, exhaustive-tooling-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download shard measurements
        if: needs.exhaustive-tooling-plan.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tooling-smoke-measurement-*
          path: tooling-smoke-measurements
          merge-multiple: true

      - name: Aggregate complete shard coverage
        id: aggregate
        continue-on-error: true
        run: |
          node scripts/measure-tooling-smoke.mjs \
            --aggregate=tooling-smoke-measurements \
            > tooling-smoke-measured.json

      - name: Report timings and drift
        id: drift
        if: steps.aggregate.outcome == 'success'
        continue-on-error: true
        run: node scripts/report-tooling-smoke-drift.mjs tooling-smoke-measured.json

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tooling-smoke-measurements
          path: |
            tooling-smoke-measured.json
            tooling-smoke-measurements
          retention-days: 30
          if-no-files-found: warn

      # Flake and drift are debt, not incidents. One issue, deduplicated, so the
      # backlog stays the single source per the repo debt contract.
      - name: File or update the tooling debt issue
        if: >-
          needs.exhaustive-tooling-plan.result != 'success' ||
          needs.exhaustive-tooling-shards.result != 'success' ||
          steps.aggregate.outcome != 'success' ||
          steps.drift.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly exhaustive tooling lane needs attention"
          body="(AI Generated).

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Commit: ${GITHUB_SHA}

          The nightly exhaustive lane failed, went flaky, or drifted far enough
          from scripts/tooling-smoke-durations.json that shard balance is stale.
          Refresh durations with: node scripts/measure-tooling-smoke.mjs --write"
          existing=$(gh issue list --label debt --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label debt --body "$body"
          fi

      - name: Require complete measurements
        env:
          PLAN_RESULT: ${{ needs.exhaustive-tooling-plan.result }}
          SHARD_RESULT: ${{ needs.exhaustive-tooling-shards.result }}
          AGGREGATE_RESULT: ${{ steps.aggregate.outcome }}
          DRIFT_RESULT: ${{ steps.drift.outcome }}
        run: |
          if [ "$PLAN_RESULT" != "success" ] \
            || [ "$SHARD_RESULT" != "success" ] \
            || [ "$AGGREGATE_RESULT" != "success" ] \
            || [ "$DRIFT_RESULT" != "success" ]; then
            echo "Nightly tooling measurement did not produce one complete stable result."
            echo "  plan: $PLAN_RESULT"
            echo "  shards: $SHARD_RESULT"
            echo "  aggregate: $AGGREGATE_RESULT"
            echo "  drift: $DRIFT_RESULT"
            exit 1
          fi

  native-acceptance:
    name: Native actor acceptance (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run native acceptance tests
        run: node scripts/run-native-acceptance.mjs

  desktop-e2e:
    name: Desktop e2e (full)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: |
          bash ../../scripts/ci-sanitize-apt-sources.sh
          npx playwright install --with-deps chromium
        working-directory: packages/desktop

      - name: Run the full desktop e2e suite
        run: npm run test:e2e
        working-directory: packages/desktop
        env:
          FREED_FRIENDS_PERF_TELEMETRY: "1"

      - name: Upload reports and telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-desktop-e2e-artifacts
          path: |
            packages/desktop/playwright-report/
            packages/desktop/test-results/
          retention-days: 14
          if-no-files-found: ignore
