[package]
name = "freed-library-core"
version = "0.1.0"
description = "Runtime-neutral native SQLite authority for Freed Library Core"
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
base64 = "0.22"
fslock = "0.2.1"
libc = "0.2"
ring = "0.17"
rusqlite = { version = "0.32", features = ["backup", "blob", "bundled", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zeroize = "1"
unicode-normalization = "0.1"

[[bin]]
name = "library-authority-sidecar"
path = "src/bin/library_authority_sidecar.rs"

[dev-dependencies]
tempfile = "3"
